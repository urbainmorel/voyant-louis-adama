name: Synchronisation Sanity & Déploiement Cloudflare Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [sanity-update]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Astro (Sanity Cloud) & Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Astro static site with live Sanity Cloud content
        env:
          PUBLIC_SANITY_PROJECT_ID: 53eovdkv
          PUBLIC_SANITY_DATASET: production
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '09f3f0ca333a62c6ab36d2fbed0802c3'
          command: pages deploy dist --project-name=voyant-louis-adama --branch=main
