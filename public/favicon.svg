<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFE27A" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B8771B" />
    </linearGradient>
  </defs>

  <!-- Coquille extérieure du cauris optimisée pour petites tailles -->
  <path
    d="M 50 10
       C 72 10 86 26 86 48
       C 86 72 70 90 50 90
       C 30 90 14 72 14 48
       C 14 26 28 10 50 10 Z"
    fill="url(#favGold)"
  />

  <!-- Fente intérieure sombre contrastée pour visibilité optimale en onglet -->
  <path
    d="M 50 22
       C 57 34 57 62 50 78
       C 43 62 43 34 50 22 Z"
    fill="#131117"
  />

  <!-- Dents du cauris simplifiées et nettes -->
  <path
    d="M 43 32 H 48.5 M 42 41 H 48.5 M 41.5 50 H 48.5 M 42 59 H 48.5 M 43 68 H 48.5"
    stroke="#FFEAA0"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path
    d="M 51.5 32 H 57 M 51.5 41 H 58 M 51.5 50 H 58.5 M 51.5 59 H 58 M 51.5 68 H 57"
    stroke="#FFEAA0"
    stroke-width="2.5"
    stroke-linecap="round"
  />
</svg>
