<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <mask id="caurisTeethMask">
      <rect width="100" height="100" fill="white" />
      <g stroke="black" stroke-width="2.6" stroke-linecap="round">
        <path d="M 41 32 L 47 32
                 M 40 40 L 47 40
                 M 39.5 48 L 47 48
                 M 40 56 L 47 56
                 M 41 64 L 47 64
                 M 43 71 L 48 71" />
        <path d="M 53 32 L 59 32
                 M 53 40 L 60 40
                 M 53 48 L 60.5 48
                 M 53 56 L 60 56
                 M 53 64 L 59 64
                 M 52 71 L 57 71" />
      </g>
    </mask>
  </defs>

  <!-- Subtle sacred circular aura (Adinkrahene) -->
  <circle cx="50" cy="50" r="44" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 3" />

  <!-- Diagonal Ascension (-35 deg) -->
  <g transform="rotate(-35 50 50)">
    <!-- Top-Right Adinkra Horn (Dwennimmen Wisdom Spiral) -->
    <path d="M 50 12
             C 52 6, 64 2, 72 6
             C 80 11, 79 21, 72 23
             C 67 24, 63 19, 66 16
             C 68 14, 70 16, 69 17"
          stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Bottom-Left Adinkra Horn (Dwennimmen Grounding Spiral) -->
    <path d="M 50 88
             C 48 94, 36 98, 28 94
             C 20 89, 21 79, 28 77
             C 33 76, 37 81, 34 84
             C 32 86, 30 84, 31 83"
          stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" fill="none" />

    <!-- Left Lateral Gye Nyame Sacred Knot (Divine Sovereignty) -->
    <path d="M 28 48
             C 27 34, 18 24, 10 29
             C 5 33, 7 40, 13 40
             C 17 39, 16 35, 12 33
             C 17 36, 20 43, 20 48
             C 20 54, 17 62, 12 63
             C 16 62, 17 57, 13 56
             C 7 56, 5 63, 10 67
             C 18 72, 27 62, 28 48 Z"
          fill="#FFFFFF" />

    <!-- Right Lateral Gye Nyame Sacred Knot (Mirrored) -->
    <path d="M 72 52
             C 73 38, 82 28, 90 33
             C 95 37, 93 44, 87 44
             C 83 43, 84 39, 88 37
             C 83 40, 80 47, 80 52
             C 80 58, 83 66, 88 67
             C 84 66, 83 61, 87 60
             C 93 60, 95 67, 90 71
             C 82 76, 73 66, 72 52 Z"
          fill="#FFFFFF" />

    <!-- Authentic Oblique Cauris Shell Contour with Notched Teeth Mask -->
    <path d="M 50 12
             C 66 12, 73 24, 72 46
             C 71 66, 61 84, 50 88
             C 39 84, 29 66, 28 46
             C 27 24, 34 12, 50 12 Z
             M 50 20
             C 41 30, 42 66, 50 78
             C 58 66, 59 30, 50 20 Z"
          fill="#FFFFFF"
          fill-rule="evenodd"
          mask="url(#caurisTeethMask)" />

    <!-- Divine Third Eye / Altar Point in Center -->
    <circle cx="50" cy="48" r="2.2" fill="#FFFFFF" />
  </g>
</svg>
